name: Generate Space Invaders Game

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Space Game SVG/GIF
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-space.gif?palette=github-dark&color_snake=purple&color_dots=#00D9FF,#00599C,#181717
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Space-Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: space-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
